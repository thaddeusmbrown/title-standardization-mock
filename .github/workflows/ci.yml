# The same gate as on a developer machine: make check.
# It takes effect once the repository is pushed.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: make check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      # Overrides .python-version, so the gate runs on each interpreter in turn.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: make check
